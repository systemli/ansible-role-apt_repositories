---
- name: Converge
  hosts: all
  become: true
  roles:
    - ansible-role-apt_repositories
  vars:
    apt_repositories:
      # full preset
      - preset: gitlab
      # Gitlab runner test
      - preset: gitlab_runner
      # Rspamd test
      - preset: rspamd
      # Test with binary key
      # - preset: sury  # not available on Ubuntu
      # Inline `key:` content exercises the staging/dearmor branch
      - filename: crowdsec-inline
        url: https://packagecloud.io/crowdsec/crowdsec/any
        types: deb
        suites: any
        key: "{{ lookup('ansible.builtin.file', playbook_dir + '/../../files/crowdsec.debian.gpg') }}"
